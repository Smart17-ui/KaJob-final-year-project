services:
  - type: web
    name: kajob-backend
    env: python
    region: frankfurt
    plan: free
    buildCommand: "./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT config.asgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "kajob-backend.onrender.com,localhost,127.0.0.1"
      - key: DB_ENGINE
        value: "django.db.backends.postgresql"
      - key: DB_NAME
        value: "kajob"
      - key: DB_USER
        value: "kajob"
      - key: DB_PORT
        value: "5432"
      - key: TIME_ZONE
        value: "Africa/Lusaka"
      - key: LANGUAGE_CODE
        value: "en-us"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://ka-job-final-year-project.vercel.app,http://localhost:5173"
      - key: FRONTEND_URL
        value: "https://ka-job-final-year-project.vercel.app"

databases:
  - name: kajob-db
    plan: free
    databaseName: kajob
    user: kajob
